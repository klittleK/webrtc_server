<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebRTC云桌面</title>
  
  <!-- 引入必要的库 -->
  <script src="/static/js/jquery-2.1.1.min.js"></script>
  <script src="/static/js/adapter.js"></script>
  
  <script>
    // 初始化屏幕共享请求
    window.addEventListener('load', () => {
      if (window.location.protocol === 'https:') {
        navigator.mediaDevices.getDisplayMedia = navigator.mediaDevices.getDisplayMedia || 
          function(constraints) {
            return new Promise((resolve, reject) => {
              window.postMessage({ type: "SS_UI_REQUEST", text: "push" }, "*");
              window.addEventListener("message", function handler(event) {
                if (event.origin !== window.location.origin) return;
                if (event.data.type === "SS_DIALOG_SUCCESS") {
                  resolve(event.data.streamId);
                } else if (event.data.type === "SS_DIALOG_CANCEL") {
                  reject(new Error("Permission denied"));
                }
                window.removeEventListener("message", handler);
              });
            }).then(streamId => {
              return navigator.mediaDevices.getUserMedia({
                audio: false,
                video: {
                  mandatory: {
                    chromeMediaSource: 'desktop',
                    chromeMediaSourceId: streamId
                  }
                }
              });
            });
          };
      }
    });
  </script>
</head>
<body>
  <div id="app"></div>
</body>
</html>
