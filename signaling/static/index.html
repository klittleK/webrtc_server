<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebRTC云桌面</title><script src="/static/js/jquery-2.1.1.min.js"></script><script src="/static/js/adapter.js"></script><script>// 初始化屏幕共享请求
    window.addEventListener('load', () => {
      if (window.location.protocol === 'https:') {
        navigator.mediaDevices.getDisplayMedia = navigator.mediaDevices.getDisplayMedia || 
          function(constraints) {
            return new Promise((resolve, reject) => {
              window.postMessage({ type: "SS_UI_REQUEST", text: "push" }, "*");
              window.addEventListener("message", function handler(event) {
                if (event.origin !== window.location.origin) return;
                if (event.data.type === "SS_DIALOG_SUCCESS") {
                  resolve(event.data.streamId);
                } else if (event.data.type === "SS_DIALOG_CANCEL") {
                  reject(new Error("Permission denied"));
                }
                window.removeEventListener("message", handler);
              });
            }).then(streamId => {
              return navigator.mediaDevices.getUserMedia({
                audio: false,
                video: {
                  mandatory: {
                    chromeMediaSource: 'desktop',
                    chromeMediaSourceId: streamId
                  }
                }
              });
            });
          };
      }
    });</script><script defer="defer" src="/static/js/chunk-vendors.715627b0.js"></script><script defer="defer" src="/static/js/app.86cecb0f.js"></script><link href="/static/css/app.02c85db3.css" rel="stylesheet"></head><body><div id="app"></div></body></html>
